<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1e6">
<title>Whack-a-Mole! — Little Burrow Arcade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Nunito:wght@600;700;800;900;1000&display=swap');
:root{--ink:#263a32;--green:#41684e;--mint:#dce8cf;--cream:#f6f1e6;--orange:#f08a55;--yellow:#f6c95a;--soil:#754b36;--shadow:0 18px 45px #344d3820}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background-color:var(--cream);background-image:radial-gradient(#6c875015 1px,transparent 1px);background-size:18px 18px;color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:grid;place-items:center;padding:30px 18px}
.app{width:min(100%,980px);position:relative}.topline{display:flex;justify-content:space-between;align-items:center;margin:0 5px 15px}.brand{display:flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:1000;color:#607667}.brand-icon{width:32px;height:32px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 0 #2f4a37}.sound{border:1.5px solid #d9ddcd;border-radius:99px;background:#fff8;padding:9px 13px;color:#55675b;font:800 12px Nunito;cursor:pointer}.sound:hover{background:#fff}
.card{background:#fffdf7;border:2px solid #e5e4d8;border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.hero{padding:27px 38px 21px;display:flex;align-items:center;justify-content:space-between}.eyebrow{color:#e07c4b;text-transform:uppercase;font-size:11px;letter-spacing:.19em;font-weight:1000;margin-bottom:6px}.title{font-weight:1000;font-size:clamp(34px,5.2vw,54px);letter-spacing:-.055em;line-height:1;margin:0}.title span{color:var(--green)}.subtitle{font-size:15px;color:#778378;font-weight:700;margin:9px 0 0}.mascot{font-size:70px;filter:drop-shadow(0 6px 0 #eadcc4);transform:rotate(7deg);margin-right:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 38px 20px}.stat{background:#f4f4e9;border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.stat-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#839084;font-weight:1000}.stat-value{font-family:'DM Mono',monospace;font-size:23px;font-weight:500;color:var(--ink)}#timer.urgent{color:#df6546;animation:pulse .6s infinite alternate}@keyframes pulse{to{transform:scale(1.12)}}.game-wrap{margin:0 24px;background:#e5edda;border:2px solid #d7e1cd;border-radius:22px;padding:15px 20px 18px;position:relative}.game-wrap:before{content:"✿   ✦   ✿";position:absolute;right:20px;top:10px;color:#91ae7d;opacity:.7;letter-spacing:13px;font-size:13px}.board{max-width:590px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 24px;position:relative}.hole{height:93px;position:relative;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;user-select:none;touch-action:manipulation}.dirt{position:absolute;bottom:4px;width:min(100%,140px);height:34px;background:linear-gradient(#916346,#71472f);border-radius:50%;box-shadow:0 6px 0 #64402e, inset 0 5px 0 #a67951;z-index:2}.dirt:after{content:"";position:absolute;width:70%;height:11px;top:5px;left:15%;border-radius:50%;background:#593b2d}.mole{position:absolute;bottom:20px;font-size:59px;line-height:1;z-index:1;transform:translateY(42px) scale(.55);opacity:0;transition:transform .16s cubic-bezier(.2,1.6,.4,1),opacity .11s;pointer-events:none;filter:drop-shadow(0 3px 0 #593b2d33)}.hole.up .mole{transform:translateY(0) scale(1);opacity:1}.hole.hit .mole{transform:translateY(18px) scale(.7);opacity:.4}.hole:active .dirt{transform:scaleY(.85)}.hint{text-align:center;font-size:12px;color:#7a8d79;font-weight:800;margin-top:8px}.controls{padding:20px 38px 25px;display:flex;justify-content:center;align-items:center;gap:14px}.start{border:0;border-radius:14px;background:var(--orange);color:#fff;padding:14px 30px;font:1000 15px Nunito;letter-spacing:.02em;cursor:pointer;box-shadow:0 5px 0 #cf6941;transition:.12s}.start:hover{transform:translateY(-2px);box-shadow:0 7px 0 #cf6941}.start:active{transform:translateY(3px);box-shadow:0 2px 0 #cf6941}.start:disabled{background:#bac6b5;box-shadow:0 5px 0 #9da998;cursor:default;transform:none}.message{font-size:13px;font-weight:800;color:#7a887c;min-width:155px}.footer{display:flex;justify-content:center;align-items:center;gap:7px;color:#9aa295;font-size:11px;font-weight:800;margin-top:15px}.footer b{color:#ed9565}.overlay{position:absolute;inset:0;background:#fffdf7e8;backdrop-filter:blur(5px);border-radius:26px;display:none;align-items:center;justify-content:center;text-align:center;z-index:5}.overlay.show{display:flex}.modal{padding:25px}.modal .big{font-size:63px}.modal h2{font-size:32px;margin:3px 0 0;letter-spacing:-.04em}.modal p{color:#758477;font-weight:700;margin:5px 0 18px}.smallscore{font:500 15px 'DM Mono';color:var(--green);background:#e8efdf;padding:9px 14px;border-radius:10px;display:inline-block;margin-bottom:18px}
@media(max-width:620px){body{padding:15px 10px}.hero{padding:23px 20px 18px}.mascot{font-size:55px;margin:0}.stats{padding:0 16px 15px;gap:7px}.stat{padding:10px 11px;display:block}.stat-label{display:block;margin-bottom:4px;font-size:9px}.stat-value{font-size:20px}.game-wrap{margin:0 10px;padding:12px 10px}.board{gap:5px 10px}.hole{height:82px}.mole{font-size:50px}.dirt{height:30px}.controls{padding:19px 15px 22px;flex-direction:column;gap:10px}.message{text-align:center}.title{font-size:36px}.subtitle{font-size:13px}.topline{margin-bottom:10px}}
</style>
</head>
<body>
<main class="app">
 <div class="topline"><div class="brand"><span class="brand-icon">⌁</span> Little Burrow Arcade</div><button class="sound" id="sound" aria-label="Toggle sound">♫ Sound on</button></div>
 <section class="card">
  <header class="hero"><div><div class="eyebrow">A tiny garden challenge</div><h1 class="title">Whack-a-<span>Mole!</span></h1><p class="subtitle">Quick paws! Those cheeky moles won't wait.</p></div><div class="mascot" aria-hidden="true">🐹</div></header>
  <div class="stats"><div class="stat"><span class="stat-label">Your score</span><span class="stat-value" id="score">000</span></div><div class="stat"><span class="stat-label">Time left</span><span class="stat-value" id="timer">30</span></div><div class="stat"><span class="stat-label">Best today</span><span class="stat-value" id="best">000</span></div></div>
  <div class="game-wrap"><div class="board" id="board" aria-label="Whack-a-mole game board"></div><div class="hint" id="hint">Tap a mole when it pops up!</div></div>
  <div class="controls"><button class="start" id="start">▶ &nbsp;Start game</button><div class="message" id="message">Ready when you are.</div></div>
 </section>
 <div class="footer"><b>✦</b> 30 seconds · How many can you catch? <b>✦</b></div>
 <div class="overlay" id="overlay"><div class="modal"><div class="big" id="resultEmoji">🎉</div><h2 id="resultTitle">Nice catching!</h2><p id="resultText">The garden says thank you.</p><div class="smallscore" id="resultScore">Score: 000</div><br><button class="start" id="again">↻ &nbsp;Play again</button></div></div>
</main>
<script>
const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),timerEl=document.querySelector('#timer'),bestEl=document.querySelector('#best'),startBtn=document.querySelector('#start'),message=document.querySelector('#message'),overlay=document.querySelector('#overlay');
let score=0,time=30,playing=false,current=-1,tick,popper,soundOn=true,audio;
const holes=[];for(let i=0;i<9;i++){const h=document.createElement('button');h.className='hole';h.setAttribute('aria-label',`Hole ${i+1}`);h.innerHTML='<span class="mole" aria-hidden="true">🐹</span><span class="dirt" aria-hidden="true"></span>';h.addEventListener('click',()=>hit(i));board.appendChild(h);holes.push(h)}
let best=Number(localStorage.getItem('burrowBest')||0);bestEl.textContent=String(best).padStart(3,'0');
function beep(freq=540,dur=.07){if(!soundOn)return;try{audio ||= new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.05;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch(e){}}
function showMole(){holes.forEach(h=>h.classList.remove('up'));let next;do{next=Math.floor(Math.random()*holes.length)}while(next===current);current=next;holes[next].classList.add('up');const delay=Math.max(460,850-score*7);popper=setTimeout(showMole,delay)}
function hit(i){if(!playing||i!==current||!holes[i].classList.contains('up'))return;score++;scoreEl.textContent=String(score).padStart(3,'0');holes[i].classList.remove('up');holes[i].classList.add('hit');setTimeout(()=>holes[i].classList.remove('hit'),180);beep(680+Math.min(score*8,250));message.textContent=['Great catch!','You got one!','Fast paws!','Lovely bonk!'][Math.floor(Math.random()*4)];current=-1}
function end(){playing=false;clearInterval(tick);clearTimeout(popper);holes.forEach(h=>h.classList.remove('up'));startBtn.disabled=false;startBtn.innerHTML='↻ &nbsp;Play again';message.textContent='Round complete!';if(score>best){best=score;localStorage.setItem('burrowBest',best);bestEl.textContent=String(best).padStart(3,'0')}document.querySelector('#resultEmoji').textContent=score>=20?'🏆':score>=10?'🌟':'🐹';document.querySelector('#resultTitle').textContent=score>=20?'Mole master!':score>=10?'Nice catching!':'Good game!';document.querySelector('#resultText').textContent=score>=20?'The moles are impressed. The garden is yours.':score>=10?'Quick paws and a sharp eye! Try for a new best.':'Those speedy moles were tricky. Fancy another go?';document.querySelector('#resultScore').textContent=`You caught ${score} mole${score===1?'':'s'}!`;overlay.classList.add('show')}
function begin(){overlay.classList.remove('show');score=0;time=30;current=-1;playing=true;scoreEl.textContent='000';timerEl.textContent='30';timerEl.classList.remove('urgent');message.textContent='Here they come!';startBtn.disabled=true;beep(500);showMole();tick=setInterval(()=>{time--;timerEl.textContent=String(time).padStart(2,'0');if(time<=5)timerEl.classList.add('urgent');if(time<=0){timerEl.textContent='00';end()}},1000)}
startBtn.addEventListener('click',begin);document.querySelector('#again').addEventListener('click',begin);document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫ Sound on':'♪ Sound off';e.currentTarget.setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on');if(soundOn)beep()});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('show')});
</script>
</body></html>
